[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rigcalc"
version = "0.1.0"
description = "Rigging geometry and load analysis tools for Vectorworks Spotlight"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Stefan D. Bahrawy" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]
dependencies = []

[project.urls]
Repository = "https://github.com/fesanb/RigCalc"
Issues = "https://github.com/fesanb/RigCalc/issues"

[tool.setuptools.packages.find]
include = ["rigcalc*"]
