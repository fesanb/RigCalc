<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RigCalc</title><style>
:root{color-scheme:dark}body{margin:0;background:#202124;color:#f4f4f4;font:13px Arial}header{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid #444}h1{margin:0 auto 0 0;font-size:18px}button,input{padding:8px;border:0;border-radius:4px;font:inherit}button{font-weight:600;cursor:pointer;background:#e9eef6;color:#1c1e21}button:disabled{opacity:.5;cursor:not-allowed}.tabs{display:flex;border-bottom:1px solid #444}.tab{border-radius:0;background:transparent;color:#eee}.tab.active{border-bottom:2px solid #69a7ff}.view{padding:14px}.hidden{display:none}.toolbar{display:flex;gap:8px}.toolbar input{flex:1;background:#303134;color:white}.filterbar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.filter{background:#33363b;color:#dce3ed;border:1px solid #555}.filter.active{background:#285a91;border-color:#69a7ff;color:white}.result-count{margin:8px 0;color:#aab0b8}table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;border-bottom:1px solid #3f4043;text-align:left;vertical-align:middle}tbody tr{cursor:pointer}tbody tr:hover{background:#30343a}th{font-size:11px;color:#b9c7d8;text-transform:uppercase}.num{text-align:right}.status{text-align:center}.id-input{width:76px;box-sizing:border-box;background:#303134;color:#fff;border:1px solid transparent;padding:5px}.id-input:focus{border-color:#69a7ff;outline:0}.card{margin-top:12px;padding:12px;background:#292a2d;border:1px solid #3b3d41;border-radius:6px}.muted{color:#aab0b8}.error{color:#ffb5af}.warning{color:#ffd180}.settings-grid{display:grid;gap:12px}.setting{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}.setting input{width:85px;background:#303134;color:#fff;border:1px solid #555;text-align:right}.setting small{grid-column:1/-1}.settings-footer{display:flex;align-items:center;gap:10px;margin-top:14px}.saved{color:#9bd6a4}.modal-backdrop{position:fixed;inset:0;z-index:20;background:#000a;display:grid;place-items:center;padding:18px}.modal-backdrop.hidden{display:none}.modal{width:min(640px,100%);max-height:calc(100vh - 36px);overflow:auto;background:#25272b;border:1px solid #5c6470;border-radius:10px;box-shadow:0 18px 50px #000;padding:20px}.modal-header{display:flex;align-items:start;gap:12px}.modal-header h2{margin:0 auto 2px 0;font-size:20px}.modal-header button{padding:4px 9px}.summary-status{font-weight:bold;padding:5px 8px;border-radius:4px}.summary-status.complete{color:#bff0c5;background:#215330}.summary-status.review{color:#ffe2a7;background:#704d1c}.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}.metric{background:#303237;border:1px solid #454950;border-radius:6px;padding:10px}.metric b{display:block;font-size:21px}.metric span{color:#b8c0ca;font-size:11px}.summary-section{margin-top:14px}.summary-section h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;color:#b9c7d8}.summary-note{line-height:1.5;color:#d9dde3}
.severity-overload td{background:#4b2527}.severity-near td{background:#4a3c22}.severity-overload:hover td{background:#613033}.severity-near:hover td{background:#5b4a29}.capacity-signal{display:inline-block;margin-top:3px;padding:2px 5px;border-radius:3px;font-size:10px;font-weight:bold}.capacity-signal.overload{background:#b64545;color:#fff}.capacity-signal.near{background:#c78926;color:#1d1608}
</style></head><body>
<header><h1>RigCalc</h1><button id="summary" disabled>Run summary</button><button id="calculate">Calculate</button><button id="reload">Reload results</button></header>
<nav class="tabs"><button class="tab active" data-tab="motors">Motors</button><button class="tab" data-tab="warnings">Warnings</button><button class="tab" data-tab="history">History</button><button class="tab" data-tab="settings">Settings</button></nav>
<main><p id="message" class="muted">Loading …</p><section id="motors" class="view"><div class="toolbar"><input id="search" placeholder="Search ID, type or truss system"></div><div class="filterbar" id="filters"><button class="filter" data-filter="near">Near limit</button><button class="filter" data-filter="overload">Overload</button><button class="filter" data-filter="manual">Manual load</button><button class="filter" data-filter="notCalculated">Not calculated</button></div><div id="resultCount" class="result-count"></div><div id="motorResults"></div></section><section id="warnings" class="view hidden"><div id="warningResults"></div></section><section id="history" class="view hidden"><div id="historyResults" class="muted">Loading history …</div></section><section id="settings" class="view hidden"><div class="card"><b>Calculation settings</b><p class="muted">These values apply when you run the next calculation.</p><div class="settings-grid"><label class="setting"><span>Cable load <small class="muted">Distributed cable weight per metre.</small></span><input id="cable" aria-label="Cable load kg per metre" type="number" value="2" min="0" step=".01"><span>kg/m</span></label><label class="setting"><span>Safety factor <small class="muted">Applied to calculated loads before analysis.</small></span><input id="factor" aria-label="Safety factor" type="number" value="1.2" min=".01" step=".01"><span>×</span></label></div><div class="settings-footer"><button id="saveSettings">Save settings</button><span id="saveStatus" class="muted"></span></div></div><div id="usedSettings" class="card muted"></div></section></main>
<script>
const $=s=>document.querySelector(s),S={snapshot:null,filters:new Set(),drawingChanged:false};
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const kg=v=>v==null?'—':Number(v).toFixed(1)+' kg',kn=v=>v==null?'—':Number(v).toFixed(3)+' kN';
const stale=()=>S.drawingChanged||Boolean(S.snapshot?.drawing_state?.stale);
const statusText=h=>String(h.status||'').toLowerCase().replaceAll('_',' ');
const utilization=h=>h.capacity_kg>0?Number(h.high_hook_mass_kg||0)/Number(h.capacity_kg):0;
function matchesFilter(h,key){if(key==='near'){const u=utilization(h);return u>=.8&&u<=1}if(key==='overload')return utilization(h)>1;if(key==='manual')return statusText(h).includes('manual');if(key==='notCalculated')return ['zero_not_calculated','diagnostic_only'].includes(String(h.status||''));return true}
const count=(group,key)=>Number(group?.[key]||0);
function openSummary(){const s=S.snapshot?.run_summary;if(!s)return;const errors=count(s.technical_errors,'count'),uncalculated=count(s.uncalculated_constructions,'count'),unhandled=count(s.unhandled_calculation_objects,'count'),loadErrors=count(s.notifications,'load_errors'),internalErrors=count(s.notifications,'internal_errors'),review=errors||uncalculated||unhandled||loadErrors||internalErrors,status=review?'REVIEW REQUIRED':'COMPLETE',found=s.found||{},calculated=s.calculated||{},outcomes=s.hoist_outcomes||{},notifications=s.notifications||{};$('#summaryStatus').textContent=status;$('#summaryStatus').className=`summary-status ${review?'review':'complete'}`;$('#summaryBody').innerHTML=`<p class="summary-note">This is the latest completed RigCalc run for the active drawing.</p><div class="summary-grid"><div class="metric"><b>${count(found,'motors')}</b><span>Motors found</span></div><div class="metric"><b>${count(calculated,'written_motors')}</b><span>Motor results written</span></div><div class="metric"><b>${count(found,'constructions')}</b><span>Truss systems</span></div></div><div class="summary-section"><h3>Calculation</h3><div class="summary-note">${count(calculated,'constructions')} of ${count(found,'constructions')} truss systems calculated · ${count(outcomes,'calculated')} calculated motor outcomes · ${count(outcomes,'direct_geometry_load')+count(outcomes,'manual_direct_load')} direct-load outcomes</div></div><div class="summary-section"><h3>Items to review</h3><div class="summary-note">${loadErrors} load errors · ${count(notifications,'deflections')} deflection markers · ${internalErrors} internal-force errors · ${errors} technical errors · ${uncalculated} uncalculated systems · ${unhandled} unhandled objects</div></div><div class="summary-section"><h3>Scope</h3><div class="summary-note">${count(found,'trusses')} truss objects · ${count(found,'dead_hangs')} dead hangs · ${count(found,'point_loads')} point loads · ${count(found,'distributed_loads')} distributed loads · ${count(found,'truss_crosses')} truss crosses</div></div>`;$('#summaryModal').classList.remove('hidden')}
function closeSummary(){$('#summaryModal').classList.add('hidden')}
function rows(){const q=$('#search').value.toLowerCase();return(S.snapshot.hoists||[]).filter(h=>`${h.hoist_id} ${h.motor_type} ${h.truss_system_name} ${h.construction_id}`.toLowerCase().includes(q)&&[...S.filters].every(key=>matchesFilter(h,key)))}
function renderHistory(){const h=S.snapshot.history;if(!h?.available){$('#historyResults').textContent=h?.message||'No previous run.';return}const items=(h.changes||[]).map(c=>{const t=c.kind==='added'?'Motor added':c.kind==='removed'?'Motor removed':Object.entries(c.changes).map(([k,v])=>`${k}: ${v.before??'—'} → ${v.after??'—'}`).join(', ');return `<div class="card"><b>${esc(c.hoist_id)}</b> — ${esc(t)}</div>`}).join('');$('#historyResults').innerHTML=`<p class="muted">Compared with ${esc(h.previous_run_id)}: ${h.previous_hoist_count} → ${h.current_hoist_count} motors.</p>${items||'<p>No changes.</p>'}`}
function render(){const d=S.snapshot,visible=rows(),changed=stale();$('#message').textContent=changed?'Drawing changed — this result is older than the active drawing. Run RigCalc again.':`${d.hoists.length} motors from the latest calculation.`;$('#message').className=changed?'warning':'muted';$('#resultCount').textContent=`Showing ${visible.length} of ${d.hoists.length} motors · click a row to show it in the drawing`;$('#motorResults').innerHTML=`<table><thead><tr><th>ID</th><th>Motor type</th><th class="num">Top Hook Load</th><th class="num">Capacity</th><th class="status">Status</th></tr></thead><tbody>${visible.map(h=>`<tr data-id="${esc(h.object_id)}" title="Show ${esc(h.hoist_id||h.object_id)} in drawing"><td><input class="id-input" aria-label="Motor ID" value="${esc(h.hoist_id||'')}" data-id="${esc(h.object_id)}" ${stale()?'disabled':''}></td><td>${esc(h.motor_type||h.name||'')}<br><small class="muted">${esc(h.truss_system_name||h.construction_id||'')}</small></td><td class="num">${kg(h.high_hook_mass_kg)}<br><small>${kn(h.high_hook_force_kn)}</small></td><td class="num">${kg(h.capacity_kg)}</td><td class="status">${esc(statusText(h))}</td></tr>`).join('')}</tbody></table>`;$('#warningResults').innerHTML=(d.warnings||[]).map(w=>`<div class="card">${esc(w.message||w.id)}</div>`).join('')||'No warnings.';const s=d.calculation_settings||{};$('#cable').value=s.cable_load_kg_m??0;$('#factor').value=s.safety_factor??1;$('#usedSettings').textContent=`Last calculation used ${s.cable_load_kg_m??0} kg/m cable load and a ${s.safety_factor??1}× safety factor.`;renderHistory()}
async function load(){try{S.snapshot=await RigCalcBridge.getSnapshot();S.drawingChanged=false;render();$('#summary').disabled=!S.snapshot.run_summary;if(S.openSummaryAfterCalculation){S.openSummaryAfterCalculation=false;openSummary()}}catch(e){$('#message').textContent='No RigCalc calculation is available for the active drawing yet.';$('#message').className='error';$('#summary').disabled=true}}
$('#summary').onclick=openSummary;document.addEventListener('DOMContentLoaded',()=>{$('#closeSummary').onclick=closeSummary;$('#summaryModal').onclick=e=>{if(e.target===$('#summaryModal'))closeSummary()};$('#calculate').addEventListener('click',()=>{S.openSummaryAfterCalculation=true},true)});
async function save(){await RigCalcBridge.saveSettings({cable_load_kg_m:Number($('#cable').value),safety_factor:Number($('#factor').value)});$('#saveStatus').textContent='Saved';$('#saveStatus').className='saved'}
async function rename(input){const h=S.snapshot.hoists.find(x=>x.object_id===input.dataset.id),newId=input.value.trim(),duplicate=(S.snapshot.hoists||[]).find(x=>x.object_id!==h.object_id&&String(x.truss_system_name||'').toLowerCase()===String(h.truss_system_name||'').toLowerCase()&&String(x.hoist_id||'').toLowerCase()===newId.toLowerCase());if(!newId||duplicate){input.value=h.hoist_id||'';input.title=duplicate?'Motor ID already exists in this truss system.':'Motor ID cannot be empty.';return}try{await RigCalcBridge.renameHoist({object_uuid:h.object_uuid,object_id:h.object_id,hoist_id:newId,truss_system:h.truss_system_name||''});h.hoist_id=newId;S.drawingChanged=true;render()}catch(e){input.value=h.hoist_id||'';input.title=String(e)}}
$('#saveSettings').onclick=save;$('#calculate').onclick=async()=>{await save();await RigCalcBridge.calculate();await load()};$('#reload').onclick=load;$('#search').oninput=render;$('#filters').onclick=e=>{const button=e.target.closest('[data-filter]');if(!button)return;const key=button.dataset.filter;S.filters.has(key)?S.filters.delete(key):S.filters.add(key);button.classList.toggle('active',S.filters.has(key));render()};$('#motorResults').onclick=async e=>{if(e.target.matches('.id-input'))return;const row=e.target.closest('tr[data-id]');if(!row)return;const h=S.snapshot.hoists.find(x=>x.object_id===row.dataset.id);try{await RigCalcBridge.showObject(h.object_uuid)}catch(err){$('#message').textContent=String(err);$('#message').className='error'}};$('#motorResults').onkeydown=e=>{if(e.target.matches('.id-input')&&e.key==='Enter'){e.preventDefault();rename(e.target)}};$('#motorResults').onchange=e=>{if(e.target.matches('.id-input'))rename(e.target)};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('hidden',x.id!==b.dataset.tab))});load();
</script><div id="summaryModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="summaryTitle"><div class="modal"><div class="modal-header"><div><h2 id="summaryTitle">Run summary</h2><span id="summaryStatus" class="summary-status"></span></div><button id="closeSummary" aria-label="Close run summary">Close</button></div><div id="summaryBody"></div></div></div><script>
// Keep capacity warnings visible in the list, not only hidden behind filters.
function decorateCapacitySignals(){if(!S.snapshot)return;document.querySelectorAll('#motorResults tr[data-id]').forEach(row=>{const h=S.snapshot.hoists.find(x=>x.object_id===row.dataset.id),u=utilization(h);if(u<.8)return;const overload=u>1;row.classList.add(overload?'severity-overload':'severity-near');const cell=row.cells[3];cell.insertAdjacentHTML('beforeend',`<br><span class="capacity-signal ${overload?'overload':'near'}">${overload?'OVERLOAD':'NEAR LIMIT'}</span>`)});}new MutationObserver(decorateCapacitySignals).observe($('#motorResults'),{childList:true});
</script></body></html>
